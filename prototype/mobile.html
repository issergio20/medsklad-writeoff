<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Быстрое списание (мобильный)</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  body { background: #e9ebef; }
  .stage { display: flex; gap: 40px; justify-content: center; align-items: flex-start; padding: 28px 24px 60px; flex-wrap: wrap; }
  .side { width: 380px; display: flex; flex-direction: column; gap: 14px; }
  .side h2 { font-size: 18px; }
  .scen { display: flex; flex-direction: column; gap: 6px; }
  .scen button { text-align: left; height: auto; padding: 9px 12px; justify-content: flex-start; white-space: normal; }
  .scen button.on { border-color: var(--accent); background: var(--accent-bg); font-weight: 600; }
  .meter { display: flex; gap: 10px; }
  .meter div { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; }
  .meter small { display: block; color: var(--muted); font-size: 11.5px; }
  .meter b { font-size: 20px; }
  .netsw { display: flex; gap: 8px; align-items: center; }

  /* Телефон */
  .phone { width: 390px; height: 844px; border-radius: 48px; background: #111; padding: 12px; box-shadow: 0 30px 60px rgba(0,0,0,.25); flex: none; }
  .screen { width: 100%; height: 100%; border-radius: 38px; overflow: hidden; background: var(--bg); position: relative; display: flex; flex-direction: column; font-size: 16px; }
  .statusbar { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; font-size: 14px; font-weight: 600; background: var(--surface); }
  .statusbar .net.off { color: var(--danger); }
  .topbar { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--border); min-height: 56px; }
  .topbar .t { flex: 1; min-width: 0; }
  .topbar .t b { display: block; font-size: 16px; }
  .topbar .t small { color: var(--muted); font-size: 12.5px; }
  .tb-btn { width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); font-size: 20px; cursor: pointer; flex: none; }
  .offline { flex: none; background: #3a2a00; color: #ffe2a0; font-size: 13.5px; padding: 8px 14px; display: flex; gap: 8px; align-items: center; }
  .body { flex: 1; overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .bottom { flex: none; padding: 12px 14px 26px; background: var(--surface); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  .big { height: 64px; border-radius: 14px; font-size: 18px; font-weight: 700; width: 100%; border: 0; cursor: pointer; background: var(--accent); color: #fff; }
  .big[disabled] { background: #c9cfd8; color: #4c5563; cursor: not-allowed; }
  .big.is-pku { background: var(--pku); }
  .big.sec { background: var(--surface); color: var(--text); border: 1.5px solid var(--border-strong); font-weight: 600; }
  .big.warn { background: #b26a00; }

  .viewfinder { flex: 1; background: radial-gradient(circle at 50% 45%, #3b4250, #12151a 70%); position: relative; display: grid; place-items: center; cursor: pointer; }
  .vf-frame { width: 260px; height: 170px; border: 3px solid rgba(255,255,255,.9); border-radius: 18px; position: relative; }
  .vf-frame::after { content: ""; position: absolute; left: 12px; right: 12px; top: 50%; height: 2px; background: #ff4d4d; box-shadow: 0 0 12px #ff4d4d; animation: scanline 1.6s ease-in-out infinite alternate; }
  @keyframes scanline { from { transform: translateY(-60px); } to { transform: translateY(60px); } }
  .vf-hint { position: absolute; bottom: 26px; left: 0; right: 0; text-align: center; color: #e8ecf2; font-size: 15px; padding: 0 24px; }
  .vf-hint small { display: block; color: #9aa4b2; font-size: 12.5px; margin-top: 4px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
  .mat-name { font-size: 17px; font-weight: 700; line-height: 1.3; }
  .mat-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; align-items: center; font-size: 13px; color: var(--muted); }
  .stock-row { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 14px; }
  .stock-row b { font-size: 18px; }
  .lbl { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 8px; display: flex; justify-content: space-between; }
  .lbl em { font-style: normal; text-transform: none; font-weight: 500; letter-spacing: 0; }
  .stepper { display: grid; grid-template-columns: 72px 1fr 72px; gap: 8px; align-items: center; }
  .stepper button { height: 64px; border-radius: 14px; border: 1.5px solid var(--border-strong); background: var(--surface); font-size: 28px; font-weight: 600; cursor: pointer; }
  .stepper .val { height: 64px; border-radius: 14px; border: 1.5px solid var(--border-strong); display: grid; place-items: center; font-size: 26px; font-weight: 700; background: var(--surface); }
  .stepper .val small { font-size: 14px; color: var(--muted); font-weight: 500; }
  .stepper.err .val { border-color: var(--danger); box-shadow: 0 0 0 1.5px var(--danger); }
  .stepper.warn .val { border-color: #c98a12; box-shadow: 0 0 0 1.5px #c98a12; }
  .mmsg { margin-top: 8px; font-size: 14px; display: flex; gap: 8px; line-height: 1.35; }
  .mmsg.err { color: var(--danger); } .mmsg.warn { color: var(--warn); } .mmsg.info { color: var(--muted); }
  .reasons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .rbtn { min-height: 60px; border-radius: 14px; border: 1.5px solid var(--border-strong); background: var(--surface); font-size: 15px; font-weight: 600; text-align: left; padding: 8px 12px; cursor: pointer; display: flex; flex-direction: column; justify-content: center; }
  .rbtn small { font-size: 11.5px; color: var(--muted); font-weight: 500; }
  .rbtn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-bg); box-shadow: 0 0 0 1.5px var(--accent); }
  .rbtn .chk { color: var(--accent); }
  .chips-m { display: flex; gap: 8px; flex-wrap: wrap; }
  .cm { min-height: 48px; padding: 0 16px; border-radius: 24px; border: 1.5px solid var(--border-strong); background: var(--surface); font-size: 15px; cursor: pointer; }
  .cm[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-bg); font-weight: 600; }
  .sbtn { width: 100%; min-height: 60px; border-radius: 14px; border: 1.5px solid var(--border-strong); background: var(--surface); text-align: left; padding: 8px 14px; font-size: 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .sbtn small { color: var(--muted); font-size: 13px; }
  .sbtn[aria-pressed="true"] { border-color: var(--pku); background: var(--pku-bg); box-shadow: 0 0 0 1.5px var(--pku); }
  .sbtn.dashed { border-style: dashed; }
  .pku-card { border: 2px solid var(--pku); }
  .pku-head { margin: -14px -14px 12px; padding: 8px 14px; background: var(--pku); color: #fff; font-size: 13.5px; font-weight: 700; border-radius: 12px 12px 0 0; display: flex; gap: 6px; align-items: center; }
  .pku-head svg { width: 16px; height: 16px; }
  .ok-line { display: flex; gap: 8px; align-items: center; padding: 12px; border-radius: 12px; background: var(--ok-bg); color: var(--ok); font-weight: 600; font-size: 15px; }
  .ok-line button { margin-left: auto; background: none; border: 0; color: var(--accent); font-size: 14px; cursor: pointer; }
  .photo { height: 120px; border-radius: 12px; background: repeating-linear-gradient(45deg, #dfe3e8, #dfe3e8 8px, #eef0f3 8px, #eef0f3 16px); display: grid; place-items: center; color: var(--muted); font-size: 14px; }

  .done { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 12px; }
  .done .circle { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; font-size: 48px; color: #fff; background: var(--ok); }
  .done .circle.wait { background: var(--pku); border-radius: 22px; transform: rotate(45deg); }
  .done .circle.wait span { transform: rotate(-45deg); }
  .done .circle.off { background: #8a93a0; }
  .done h2 { font-size: 24px; }
  .done p { margin: 0; color: var(--muted); font-size: 15px; }
  .done .docchip { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; font-size: 14px; text-align: left; width: 100%; }
  .progress { width: 100%; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--ok); animation: prog 3s linear forwards; }
  @keyframes prog { from { width: 0; } to { width: 100%; } }

  .doc { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .doc-h { display: flex; gap: 8px; align-items: center; padding: 10px 14px; background: var(--surface-2); border-bottom: 1px solid var(--border); font-size: 14px; }
  .doc-h b { flex: 1; }
  .doc ul { list-style: none; margin: 0; padding: 0; }
  .doc li { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 14px; display: flex; gap: 10px; }
  .doc li:last-child { border-bottom: 0; }
  .doc li .q { margin-left: auto; font-weight: 700; white-space: nowrap; }
  .sync-err { border: 2px solid var(--danger); border-radius: 14px; background: var(--surface); padding: 14px; }
  .sync-err h3 { font-size: 16px; color: var(--danger); margin-bottom: 4px; }
  .search-m { height: 56px; width: 100%; border-radius: 14px; border: 1.5px solid var(--border-strong); padding: 0 16px; font-size: 17px; }
  .res-m { width: 100%; text-align: left; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: 15px; }
  .res-m .mat-meta { margin-top: 4px; }
</style>
</head>
<body>
<div class="demo-bar"><b>Прототип · Экран 3 — быстрое списание с терминала</b><span class="sep"></span><a href="index.html">← Все прототипы</a></div>

<div class="stage">
  <div class="phone"><div class="screen" id="screen"></div></div>

  <aside class="side">
    <h2>Сценарии</h2>
    <div class="scen" id="scen"></div>
    <div class="netsw"><button class="btn" id="netBtn"></button><span style="color:var(--muted);font-size:12.5px">в подсобке связь пропадает на 1–2 мин</span></div>
    <div class="meter"><div><small>Касаний с момента скана</small><b id="taps">0</b></div><div><small>Время</small><b id="secs">0 с</b></div></div>
    <div class="note" id="explain"></div>
  </aside>
</div>

<script src="assets/data.js"></script>
<script>
const PKU_SVG = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0 1.5 2.5v5C1.5 11.6 4.3 15 8 16c3.7-1 6.5-4.4 6.5-8.5v-5L8 0zm0 4a1.5 1.5 0 0 1 1.5 1.5c0 .6-.3 1-.8 1.3L9.5 11h-3l.8-4.2A1.5 1.5 0 0 1 8 4z"/></svg>';
const pkuBadge = () => `<span class="pku">${PKU_SVG}Учётный</span>`;
const ICON = { room: '🚪', expired: '⌛', broken: '💥', disposal: '♻', other: '…' };

const SCEN = [
  { id: 'normal', t: '① Обычный материал — 10 секунд', mid: 'm3' },
  { id: 'pku-dm', t: '② Учётный, серия считана с DataMatrix', mid: 'a1', dm: true, reason: 'broken' },
  { id: 'pku-nocode', t: '③ Учётный без штрихкода, серия нечитаема', mid: 'a3', nocode: true },
  { id: 'offline', t: '④ Пропала связь после скана', mid: 'm1', offline: true },
  { id: 'syncerr', t: '⑤ Отказ сервера при синхронизации', syncErr: true },
  { id: 'expired', t: '⑥ Просрочка ниже неснижаемого', mid: 'm6', reason: 'expired', qty: 8 },
  { id: 'min', t: '⑦ Ниже неснижаемого (не просрочка)', mid: 'm2', qty: 9, reason: 'room' },
  { id: 'today', t: '⑧ Несколько причин подряд → документы дня', today: true }
];

const S = { scen: 'normal', screen: 'scan', online: true, mid: null, qty: 1, reason: 'room', room: '203', series: '', comment: '', photo: false,
  lastReason: 'room', taps: 0, t0: 0, dm: false, outcome: null };

const TODAY = [
  { reason: 'room', room: '203', status: 'ok', items: [['Перчатки нитриловые, M', '2 упак.'], ['Шприц 5 мл 22G', '20 шт.'], ['Спиртовые салфетки', '1 упак.']] },
  { reason: 'room', room: '101', status: 'ok', items: [['Бинт марлевый 7 м × 14 см', '4 шт.']] },
  { reason: 'expired', status: 'ok', items: [['Хлоргексидин 0,05 %, 100 мл', '12 фл.']] },
  { reason: 'broken', status: 'wait', items: [['Морфин 10 мг/мл, амп. 1 мл · серия М-230411', '1 амп.']] }
];

const EXPLAIN = {
  scan: '<b>Скан — основной ввод.</b> Камера включена сразу при открытии. Подключённый сканер тоже работает: он «печатает» код. Нажмите на видоискатель, чтобы сымитировать скан. Склад привязан к терминалу — выбирать его не нужно.',
  item: '<b>Карточка после скана.</b> Количество по умолчанию — 1, причина — та же, что в прошлый раз. Для обычного материала остаётся одно касание: «Списать». Все цели ≥ 56 px (под перчатку), главная кнопка — в зоне большого пальца. Кнопка сама говорит, чего не хватает.',
  pku: '<b>Учётный с терминала — можно, но честно.</b> Серия берётся из DataMatrix, а если её там нет — выбирается из серий на остатке крупными кнопками. Комментарий — из готовых фраз в одно касание или голосом. «Прочее» для учётного не показываем вообще. Бой/утилизация уходят на подтверждение, остаток резервируется.',
  done: '<b>Подтверждение без модалок.</b> Экран сам вернётся к сканеру через 3 с — можно сразу сканировать следующую упаковку. Видно, в какой документ дня попала позиция. Отменить можно сразу здесь.',
  offline: '<b>Нет связи.</b> Ввод не теряется: позиция сохранена на телефоне со статусом «Не проведено — ждёт сети». Без проверки на сервере документ не проводится. Коробку можно отдавать: при связи проведём автоматически, а если сервер откажет — придёт уведомление с готовым действием.',
  today: '<b>Документы дня.</b> Кладовщик выбирает причину у каждой позиции, а система раскладывает их по документам: одна причина — один документ (проводка не ломается). Пять документов из-за пяти причин он больше не создаёт руками, поэтому «Прочее» не нужно.',
  manual: '<b>Нет штрихкода.</b> Поиск по названию — крупные строки, учётные видны сразу.',
  syncerr: '<b>Сервер отказал.</b> Пока не было связи, кто-то списал часть остатка с компьютера. Предлагаем готовый выход: списать столько, сколько есть, или передать разбор на компьютер.'
};

const screenEl = document.getElementById('screen');
const m = () => findMaterial(S.mid);
const avail = x => Math.max(0, x.stock - x.min);

function tap() { S.taps++; meter(); }
function meter() { document.getElementById('taps').textContent = S.taps; document.getElementById('secs').textContent = S.t0 ? Math.round((Date.now() - S.t0) / 1000) + ' с' : '0 с'; }
setInterval(() => { if (S.t0 && S.screen !== 'done') meter(); }, 500);

function statusbar() {
  return `<div class="statusbar"><span>14:20</span><span class="net ${S.online ? '' : 'off'}">${S.online ? '▂▄▆ LTE' : '✕ нет сети'} · 🔋 78%</span></div>
    ${S.online ? '' : `<div class="offline">⚠ <span>Нет связи. Всё, что вы введёте, сохранится на телефоне и проведётся при появлении сети.</span></div>`}`;
}

function issues() {
  const x = m(), e = [], w = [];
  if (S.qty > x.stock) e.push(`На складе только ${x.stock} ${x.unit}.`);
  else if (S.reason === 'expired') { if (x.min && x.stock - S.qty < x.min) w.push(`Остаток станет ${x.stock - S.qty} — ниже неснижаемого (${x.min}). Просрочку всё равно списываем сегодня. Заявку на пополнение создадим сами.`); }
  else if (x.min && S.qty > avail(x)) e.push(`Ниже неснижаемого: можно списать ${avail(x)} ${x.unit}. Если упаковка просрочена — выберите «Срок годности».`);
  return { e, w };
}
function missing() {
  const x = m();
  if (issues().e.length) return 'Исправьте количество';
  if (!S.reason) return 'Выберите причину';
  if (S.reason === 'room' && !S.room) return 'Выберите кабинет';
  if (x.accounted) {
    if (!S.series) return 'Укажите серию';
    if (S.series === 'unknown' && !S.photo) return 'Сфотографируйте упаковку';
    if (!S.comment) return 'Добавьте комментарий';
  }
  return null;
}
const needsApproval = () => m().accounted && (S.reason === 'broken' || S.reason === 'disposal' || S.series === 'unknown');

function render() {
  let html = statusbar();
  const sc = S.screen;
  if (sc === 'scan') {
    html += `<div class="topbar"><div class="t"><b>Списание</b><small>Основной склад · терминал подсобки</small></div><button class="tb-btn" data-go="today" aria-label="Документы за сегодня">📋</button></div>
      <div class="viewfinder" id="vf"><div class="vf-frame"></div><div class="vf-hint">Наведите на штрихкод упаковки<small>или нажмите кнопку на сканере</small></div></div>
      <div class="bottom"><button class="big sec" data-go="manual">⌨ Нет штрихкода — найти по названию</button></div>`;
  }
  if (sc === 'manual') {
    html += `<div class="topbar"><button class="tb-btn" data-go="scan" aria-label="Назад">←</button><div class="t"><b>Поиск по названию</b></div></div>
      <div class="body"><input class="search-m" value="спирт" aria-label="Поиск">
        ${MATERIALS.filter(x => /спирт/i.test(x.name)).map(x => `<button class="res-m" data-pick="${x.id}"><div><b>${x.name}</b></div><div class="mat-meta">${x.sku} ${x.accounted ? pkuBadge() : ''} · остаток ${x.stock} ${x.unit}</div></button>`).join('')}
      </div>`;
  }
  if (sc === 'item') html += itemScreen();
  if (sc === 'done') html += doneScreen();
  if (sc === 'today') html += todayScreen();
  screenEl.innerHTML = html;
  bind();
  document.getElementById('explain').innerHTML = EXPLAIN[sc === 'item' && m().accounted ? 'pku' : sc === 'done' && !S.online ? 'offline' : sc === 'today' && S.scen === 'syncerr' ? 'syncerr' : sc] || '';
  document.getElementById('netBtn').textContent = S.online ? '📶 Связь есть — выключить' : '✕ Связи нет — включить';
}

function itemScreen() {
  const x = m(), iss = issues(), miss = missing();
  const reasons = REASONS.filter(r => !(x.accounted && r.id === 'other'));
  const appr = needsApproval();
  let pku = '';
  if (x.accounted) {
    const serBlock = S.dm
      ? `<div class="ok-line">✓ Серия ${S.series} — считана с кода<button data-act="undm">Изменить</button></div>`
      : `${x.series.filter(s => s.qty).map(s => `<button class="sbtn" data-series="${s.no}" aria-pressed="${S.series === s.no}"><span><b>${s.no}</b></span><small>${s.qty} ${x.unit} · до ${s.exp}</small></button>`).join('')}
         <button class="sbtn dashed" data-series="unknown" aria-pressed="${S.series === 'unknown'}"><span>Не могу прочитать серию</span><small>решит медсестра</small></button>
         ${S.series === 'unknown' ? (S.photo ? `<div class="ok-line">📷 Фото упаковки прикреплено<button data-act="rephoto">Переснять</button></div>` : `<button class="big sec" data-act="photo">📷 Сфотографировать упаковку</button>`) : ''}`;
    pku = `
      <div><div class="lbl">Серия *<em>${S.dm ? '' : 'выберите ту, что на упаковке'}</em></div><div style="display:flex;flex-direction:column;gap:8px">${serBlock}</div></div>
      <div><div class="lbl">Комментарий *<em>одно касание</em></div>
        <div class="chips-m">${['Разбита при выдаче', 'Выдано по назначению', 'Истёк срок', 'Повреждена упаковка'].map(c => `<button class="cm" data-comment="${c}" aria-pressed="${S.comment === c}">${c}</button>`).join('')}
        <button class="cm" data-comment="🎤 «Ампула треснула в лотке при выдаче процедурной»" aria-pressed="${S.comment.startsWith('🎤')}">🎤 Надиктовать</button></div></div>`;
  }
  return `<div class="topbar"><button class="tb-btn" data-go="scan" aria-label="Отмена">✕</button><div class="t"><b>Списать</b><small>Основной склад</small></div><button class="tb-btn" data-go="today">📋</button></div>
  <div class="body">
    <div class="card ${x.accounted ? 'pku-card' : ''}">
      ${x.accounted ? `<div class="pku-head">${PKU_SVG} УЧЁТНЫЙ МАТЕРИАЛ — нужны серия и комментарий</div>` : ''}
      <div class="mat-name">${x.name}</div>
      <div class="mat-meta">${x.sku}${x.min ? ` <span class="tag warn">▼ Неснижаемый ${x.min}</span>` : ''}${x.expired ? ` <span class="tag danger">⌛ Просрочено ${x.expired}</span>` : ''}</div>
      <div class="stock-row"><span>На складе <b>${x.stock}</b> ${x.unit}</span><span>${x.min ? `можно <b>${avail(x)}</b>` : 'можно всё'}</span></div>
    </div>
    <div><div class="lbl">Количество</div>
      <div class="stepper ${iss.e.length ? 'err' : iss.w.length ? 'warn' : ''}"><button data-q="-1" aria-label="Меньше">−</button><div class="val">${S.qty} <small>${x.unit}</small></div><button data-q="1" aria-label="Больше">+</button></div>
      ${iss.e.map(t => `<div class="mmsg err"><b>✕</b><span>${t}</span></div>`).join('')}${iss.w.map(t => `<div class="mmsg warn"><b>!</b><span>${t}</span></div>`).join('')}
    </div>
    <div><div class="lbl">Причина${S.lastReason && S.reason === S.lastReason ? '<em>как в прошлый раз</em>' : ''}</div>
      <div class="reasons">${reasons.map(r => `<button class="rbtn" data-reason="${r.id}" aria-pressed="${S.reason === r.id}"><span>${S.reason === r.id ? `<span class="chk">✓</span> ` : ``}${ICON[r.id]} ${r.short}</span>${x.accounted && (r.id === 'broken' || r.id === 'disposal') ? '<small>◆ с подтверждением медсестры</small>' : ''}</button>`).join('')}</div>
      ${x.accounted ? '<div class="mmsg info">«Прочее» для учётных недоступно — нужна конкретная причина.</div>' : ''}
    </div>
    ${S.reason === 'room' ? `<div><div class="lbl">Кабинет<em>последние</em></div><div class="chips-m">${['203', '101', '305', '412'].map(r => `<button class="cm" data-room="${r}" aria-pressed="${S.room === r}">${r}</button>`).join('')}<button class="cm">Другой…</button></div></div>` : ''}
    ${pku}
  </div>
  <div class="bottom">
    ${appr && !miss ? `<div class="mmsg info" style="margin:0">◆ Уйдёт на подтверждение: ${APPROVER.name}. Количество будет в резерве.</div>` : ''}
    <button class="big ${x.accounted ? 'is-pku' : ''} ${iss.w.length && !miss ? 'warn' : ''}" id="submit" ${miss ? 'disabled' : ''}>${miss ? miss : appr ? `Отправить на подтверждение` : `Списать ${S.qty} ${x.unit}${S.reason === 'room' ? ` → каб. ${S.room}` : ''}`}</button>
  </div>`;
}

function doneScreen() {
  const x = m(), r = REASONS.find(r => r.id === S.reason);
  const docName = `«${r.name}${S.reason === 'room' ? ' · ' + S.room : ''}»`;
  if (!S.online) return `<div class="done"><div class="circle off">⏳</div><h2>Сохранено на телефоне</h2>
    <p>${x.name}, ${S.qty} ${x.unit}</p>
    <div class="docchip"><b>Не проведено — ждёт сети.</b><br>Как только связь появится, проверим остаток на сервере и проведём. <b>Коробку можно отдавать.</b> Если что-то не сойдётся, придёт уведомление.</div>
    <button class="big sec" data-go="scan">Сканировать следующее</button><button class="btn ghost" data-go="today">Очередь: 1 позиция ждёт сети</button></div>`;
  if (S.outcome === 'wait') return `<div class="done"><div class="circle wait"><span>◆</span></div><h2>Отправлено на подтверждение</h2>
    <p>${x.name}, ${S.qty} ${x.unit} · серия ${S.series === 'unknown' ? 'не определена' : S.series}</p>
    <div class="docchip">Запрос у <b>${APPROVER.name}</b>. Пока она не ответит, ${S.qty} ${x.unit} в резерве. <b>Ждать не нужно</b> — о решении придёт уведомление.</div>
    <div class="progress"><i></i></div><button class="big sec" data-go="scan">Сканировать следующее</button></div>`;
  return `<div class="done"><div class="circle">✓</div><h2>Списано</h2>
    <p>${x.name} — ${S.qty} ${x.unit}</p>
    <div class="docchip">Добавлено в документ дня ${docName}. Сегодня в нём ${S.reason === 'room' && S.room === '203' ? 4 : 1} поз.<br><span style="color:var(--muted)">Остаток: ${x.stock - S.qty} ${x.unit}</span></div>
    <div class="progress"><i></i></div>
    <div style="display:flex;gap:8px;width:100%"><button class="big sec" data-act="undo" style="flex:1">↶ Отменить</button><button class="big" data-go="scan" style="flex:1">Дальше</button></div></div>`;
}

function todayScreen() {
  const r = id => REASONS.find(x => x.id === id).name;
  const syncErr = S.scen === 'syncerr';
  const queued = !S.online || syncErr;
  return `<div class="topbar"><button class="tb-btn" data-go="scan" aria-label="Назад">←</button><div class="t"><b>Сегодня, 14 октября</b><small>${TODAY.length + (queued ? 1 : 0)} ${TODAY.length + (queued ? 1 : 0) > 4 ? 'документов' : 'документа'} · по одному на причину</small></div></div>
  <div class="body">
    ${syncErr ? `<div class="sync-err"><h3>✕ Не проведено: перчатки L</h3>
      <div style="font-size:14px">Пока не было связи, остаток изменился: на сервере доступно <b>8 упак.</b>, а вы списали 10. Коробку уже отдали в кабинет 203?</div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px"><button class="big" data-act="fix8">Списать 8 — сколько есть</button><button class="big sec" data-act="handoff">Разберусь с компьютера</button></div>
      <div class="mmsg info">Если выдали больше, чем числится, — это расхождение. Его разберут при инвентаризации, черновик сохранится.</div></div>` : ''}
    ${!S.online && !syncErr ? `<div class="doc"><div class="doc-h">⏳ <b>Ждёт сети</b><span class="tag">не проведено</span></div><ul><li>${m() ? m().name : 'Перчатки нитриловые, M'}<span class="q">${S.qty} шт.</span></li></ul></div>` : ''}
    ${TODAY.map(d => `<div class="doc"><div class="doc-h">${ICON[d.reason]} <b>${r(d.reason)}${d.room ? ' · каб. ' + d.room : ''}</b>${d.status === 'ok' ? '<span class="tag ok">✓ проведён</span>' : '<span class="tag" style="color:var(--pku)">◆ ждёт подтверждения</span>'}</div>
      <ul>${d.items.map(i => `<li>${i[0]}<span class="q">${i[1]}</span></li>`).join('')}</ul></div>`).join('')}
    <div class="note">Одна причина — один документ. Новую позицию с той же причиной (и кабинетом) система добавит в существующий документ дня, а с другой причиной — создаст новый.</div>
  </div>`;
}

function bind() {
  screenEl.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { tap(); S.screen = b.dataset.go; if (S.screen === 'scan') resetItem(); render(); });
  const vf = document.getElementById('vf');
  if (vf) vf.onclick = () => doScan();
  screenEl.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { tap(); openItem(b.dataset.pick); });
  screenEl.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { tap(); S.qty = Math.max(1, S.qty + +b.dataset.q); render(); });
  screenEl.querySelectorAll('[data-reason]').forEach(b => b.onclick = () => { tap(); S.reason = b.dataset.reason; render(); });
  screenEl.querySelectorAll('[data-room]').forEach(b => b.onclick = () => { tap(); S.room = b.dataset.room; render(); });
  screenEl.querySelectorAll('[data-series]').forEach(b => b.onclick = () => { tap(); S.series = b.dataset.series; render(); });
  screenEl.querySelectorAll('[data-comment]').forEach(b => b.onclick = () => { tap(); S.comment = b.dataset.comment; render(); });
  screenEl.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    tap(); const a = b.dataset.act;
    if (a === 'undm') { S.dm = false; S.series = ''; }
    if (a === 'photo' || a === 'rephoto') S.photo = true;
    if (a === 'undo') { S.screen = 'scan'; resetItem(); toastM('Списание отменено, остаток возвращён'); }
    if (a === 'fix8') { S.scen = 'today'; toastM('Списано 8 упак. Расхождение 2 упак. — в черновике для разбора'); }
    if (a === 'handoff') { S.scen = 'today'; toastM('Черновик ждёт вас в «Документы → Черновики» на компьютере'); }
    render();
  });
  const sub = document.getElementById('submit');
  if (sub) sub.onclick = () => {
    tap(); S.outcome = needsApproval() ? 'wait' : 'ok'; S.lastReason = S.reason; S.screen = 'done'; render(); meter(); S.t0 = 0;
    if (S.online && S.outcome === 'ok') setTimeout(() => { if (S.screen === 'done') { S.screen = 'scan'; resetItem(); render(); } }, 3200);
  };
}
function toastM(t) {
  const d = document.createElement('div'); d.className = 'toast'; d.style.cssText = 'position:absolute;left:14px;right:14px;bottom:110px;z-index:5';
  d.textContent = t; screenEl.appendChild(d); setTimeout(() => d.remove(), 3000);
}
function resetItem() { S.mid = null; S.qty = 1; S.series = ''; S.comment = ''; S.photo = false; S.dm = false; S.reason = S.lastReason; S.taps = 0; S.t0 = 0; meter(); }
function openItem(mid, opt = {}) {
  const sc = SCEN.find(s => s.id === S.scen);
  S.mid = mid; S.screen = 'item'; S.qty = sc.qty || 1; S.reason = sc.reason || S.lastReason;
  if (opt.dm) { S.dm = true; S.series = findMaterial(mid).series[0].no; }
  render();
}
function doScan() {
  const sc = SCEN.find(s => s.id === S.scen);
  S.taps = 0; S.t0 = Date.now(); meter();
  if (sc.nocode) { S.screen = 'manual'; render(); return; }
  if (sc.offline) S.online = false;
  openItem(sc.mid || 'm3', { dm: sc.dm });
}

document.getElementById('scen').innerHTML = SCEN.map(s => `<button class="btn" data-s="${s.id}">${s.t}</button>`).join('');
document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
  S.scen = b.dataset.s; S.online = true; S.lastReason = 'room'; S.room = '203'; resetItem();
  const sc = SCEN.find(s => s.id === S.scen);
  S.screen = sc.today || sc.syncErr ? 'today' : 'scan';
  document.querySelectorAll('[data-s]').forEach(x => x.classList.toggle('on', x === b));
  render();
});
document.getElementById('netBtn').onclick = () => { S.online = !S.online; render(); };
document.querySelector('[data-s="normal"]').classList.add('on');
render();
</script>
</body>
</html>
